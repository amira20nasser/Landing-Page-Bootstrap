<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        .c {
            display: flex;
            justify-content: space-around;
            background-color: lightblue;
            font-size: 20px;
        }

        .c div {
            padding: 10px;
        }

        /* Tablet*/
        @media (max-width: 900px) and (min-width: 601px) {
            .c {
                flex-direction: column;
                background-color: lightgreen;
                font-size: 18px;
            }
        }

        /* Mobile  */
        @media (max-width: 600px) {
            .c {
                flex-direction: column;
                background-color: lightcoral;
                font-size: 16px;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <!-- Task 1 -->
    <h1 class="text-danger text-center bg-dark">Hello, world!</h1>

    <!-- Task 2 -->
    <div class="task2">
        <div class="row mb-2 text-center" style="gap: 10px;">
            <div class="col bg-primary text-white p-3">1</div>
            <div class="col bg-primary text-white p-3">2</div>
            <div class="col bg-primary text-white p-3">3</div>
            <div class="col bg-primary text-white p-3">1</div>
            <div class="col bg-primary text-white p-3">2</div>
            <div class="col bg-primary text-white p-3">3</div>
            <div class="col bg-primary text-white p-3">1</div>
            <div class="col bg-primary text-white p-3">2</div>
            <div class="col bg-primary text-white p-3">3</div>
            <div class="col bg-primary text-white p-3">1</div>
            <div class="col bg-primary text-white p-3">2</div>
            <div class="col bg-primary text-white p-3">3</div>
        </div>

        <div class="row mb-2 text-center" style="gap: 10px;">
            <div class="col bg-secondary text-white p-3">1</div>
            <div class="col bg-secondary text-white p-3">2</div>
            <div class="col bg-secondary text-white p-3">3</div>
            <div class="col bg-secondary text-white p-3">4</div>
        </div>

        <div class="row mb-2 text-center" style="gap: 10px;">
            <div class="col bg-info text-white p-3">1</div>
            <div class="col bg-info text-white p-3">2</div>
            <div class="col bg-info text-white p-3">3</div>
        </div>

        <div class="row mb-2 text-center" style="gap: 10px;">
            <div class="col bg-warning text-white p-3">1</div>
            <div class="col bg-warning text-white p-3">2</div>
        </div>

        <div class="row mb-2 text-center">
            <div class="col bg-success text-white p-3">1</div>
        </div>
    </div>

    <!-- Task 3 -->
    <div class="c">
        <h3>Text One</h3>
        <h3>Text Two</h3>
        <h3>Text Three</h3>
    </div>
</body>

</html>
